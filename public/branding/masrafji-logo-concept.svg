<svg width="1800" height="1080" viewBox="0 0 1800 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6F4CFF"/>
      <stop offset="52%" stop-color="#2F7BFF"/>
      <stop offset="100%" stop-color="#12B6B2"/>
    </linearGradient>
    <linearGradient id="brandGradientSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A72FF"/>
      <stop offset="50%" stop-color="#4A8CFF"/>
      <stop offset="100%" stop-color="#2FC6C2"/>
    </linearGradient>
    <radialGradient id="glowGradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4B7FFF" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#4B7FFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0E1630" flood-opacity="0.12"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#182248" flood-opacity="0.22"/>
    </filter>
    <style>
      .arabic {
        font-family: "Cairo", "Noto Sans Arabic", "Segoe UI", sans-serif;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .latin {
        font-family: "Inter", "Segoe UI", sans-serif;
        font-weight: 500;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#F3F6FC"/>

  <rect x="90" y="110" width="1620" height="430" rx="34" fill="#FFFFFF" filter="url(#panelShadow)"/>
  <rect x="90" y="560" width="1620" height="430" rx="34" fill="#0E1428" filter="url(#panelShadow)"/>

  <g transform="translate(190 205)">
    <circle cx="115" cy="115" r="96" fill="url(#glowGradient)" filter="url(#softBlur)"/>
    <g filter="url(#iconShadow)">
      <rect x="28" y="28" width="174" height="174" rx="44" fill="url(#brandGradient)"/>
      <rect x="56" y="66" width="118" height="96" rx="24" fill="white" fill-opacity="0.16"/>
      <path d="M64 142L95 112L120 127L155 90" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="95" cy="112" r="7.5" fill="white"/>
      <circle cx="120" cy="127" r="7.5" fill="white"/>
      <circle cx="155" cy="90" r="7.5" fill="white"/>
      <rect x="72" y="74" width="86" height="12" rx="6" fill="white" fill-opacity="0.78"/>
    </g>
  </g>

  <g transform="translate(190 655)">
    <circle cx="115" cy="115" r="96" fill="url(#glowGradient)" filter="url(#softBlur)"/>
    <g filter="url(#iconShadow)">
      <rect x="28" y="28" width="174" height="174" rx="44" fill="url(#brandGradientSoft)"/>
      <rect x="56" y="66" width="118" height="96" rx="24" fill="white" fill-opacity="0.16"/>
      <path d="M64 142L95 112L120 127L155 90" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="95" cy="112" r="7.5" fill="white"/>
      <circle cx="120" cy="127" r="7.5" fill="white"/>
      <circle cx="155" cy="90" r="7.5" fill="white"/>
      <rect x="72" y="74" width="86" height="12" rx="6" fill="white" fill-opacity="0.78"/>
    </g>
  </g>

  <g transform="translate(450 250)">
    <text x="780" y="118" class="arabic" direction="rtl" unicode-bidi="plaintext" font-size="118" fill="#15203D">E51A,J</text>
    <text x="780" y="170" class="latin" direction="ltr" font-size="33" fill="#5D6A8A">Masrafji</text>
    <text x="0" y="203" class="latin" font-size="24" fill="#93A0BF">Light Mode Lockup</text>
  </g>

  <g transform="translate(450 700)">
    <text x="780" y="118" class="arabic" direction="rtl" unicode-bidi="plaintext" font-size="118" fill="#EAF0FF">E51A,J</text>
    <text x="780" y="170" class="latin" direction="ltr" font-size="33" fill="#A8B7DB">Masrafji</text>
    <text x="0" y="203" class="latin" font-size="24" fill="#7D8CB1">Dark Mode Lockup</text>
  </g>

  <g transform="translate(1450 240)">
    <rect width="190" height="190" rx="46" fill="url(#brandGradient)" filter="url(#iconShadow)"/>
    <rect x="30" y="42" width="130" height="110" rx="26" fill="white" fill-opacity="0.15"/>
    <path d="M40 134L74 104L99 119L148 80" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="74" cy="104" r="7" fill="white"/>
    <circle cx="99" cy="119" r="7" fill="white"/>
    <circle cx="148" cy="80" r="7" fill="white"/>
  </g>
  <text x="1545" y="462" text-anchor="middle" class="latin" font-size="22" fill="#66739B">App Icon</text>

  <g transform="translate(1450 690)">
    <rect width="190" height="190" rx="46" fill="url(#brandGradientSoft)" filter="url(#iconShadow)"/>
    <rect x="30" y="42" width="130" height="110" rx="26" fill="white" fill-opacity="0.15"/>
    <path d="M40 134L74 104L99 119L148 80" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="74" cy="104" r="7" fill="white"/>
    <circle cx="99" cy="119" r="7" fill="white"/>
    <circle cx="148" cy="80" r="7" fill="white"/>
  </g>
  <text x="1545" y="912" text-anchor="middle" class="latin" font-size="22" fill="#8C9CC4">Dark Icon</text>
</svg>
