<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masrafji Premium Logo Preview</title>
  <style>
    :root {
      --bg: #0a1225;
      --card: #121c36;
      --text: #eaf0ff;
      --muted: #9db0d6;
      --border: #263559;
      --chip: #1a2748;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px;
      color: #d5e1ff;
      letter-spacing: 0.2px;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid #2c3d68;
      background: #0b1225;
    }
    .chip {
      display: inline-block;
      background: var(--chip);
      border: 1px solid #2d3e69;
      color: #c4d5fb;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-right: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>Masrafji Premium Logo</h1>
  <p>Single source of truth preview: icon + bilingual wordmark + light/dark usage.</p>

  <section class="card">
    <h2 class="title">Premium Master Board</h2>
    <span class="chip">Masrafji</span>
    <span class="chip">مصرفجي</span>
    <span class="chip">Light + Dark</span>
    <img src="./masrafji-logo-premium.svg" alt="Masrafji premium logo board" />
  </section>
</body>
</html>
